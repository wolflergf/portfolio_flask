name: Update Blog with AI News

on:
  schedule:
    - cron: "0 8 * * *"   # Every day at 08:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-generativeai python-slugify

      - name: Run blog updater
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python utils/blog_updater.py

      - name: Commit and push new post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog_posts/*.md
          # Exit 0 silently if there is nothing new to commit
          git diff --cached --quiet && echo "[INFO] No new posts." && exit 0
          git commit -m "auto: new blog post [skip ci]"
          git push

      - name: Trigger Railway redeploy
        # Railway re-deploys automatically on push when GitHub integration is active.
        # This step is a safety net in case you use the Railway deploy webhook instead.
        # To enable: add RAILWAY_WEBHOOK_URL to your GitHub secrets and uncomment below.
        # run: curl -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}"
        run: echo "Railway redeploy triggered via git push."
