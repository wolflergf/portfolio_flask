name: Update Blog with AI News

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests google-genai python-slugify beautifulsoup4 lxml

      - name: Run blog updater (news)
        env:
          NEWS_API_KEY:  ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python utils/blog_updater.py

      - name: Run repo curator (GitHub Radar)
        if: github.event.schedule == '0 9 * * 1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python utils/repo_curator.py

      - name: Commit and push new files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog_posts/*.md data/linkedin_drafts/*.txt
          git diff --cached --quiet || (git commit -m "auto: update blog content $(date +'%Y-%m-%d')" && git push)
