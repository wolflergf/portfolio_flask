name: Intelligence-Driven News Blog

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 9:00 AM UTC
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests google-genai python-slugify beautifulsoup4 lxml

      - name: Run Intelligence-Driven News Blog
        env:
          NEWS_API_KEY:  ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python utils/blog_updater.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Auto-post: New AI Insights $(date +'%Y-%m-%d')" && git push)

      - name: Workspace Cleanup
        run: |
          rm -rf data/logs/*.log
