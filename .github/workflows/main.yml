name: Intelligence-Driven News Blog

on:
  schedule:
    - cron: "0 9 */2 * *" # Every two days at 9:00 AM UTC
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests google-genai python-slugify beautifulsoup4 lxml

      - name: Debug Path Structure
        run: |
          echo "Current Working Directory:"
          pwd
          echo "Directory Listing (Recursive):"
          ls -R

      - name: Run Intelligence-Driven News Blog
        env:
          NEWS_API_KEY:  ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python utils/blog_updater.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes in the data or logs directories
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "Changes detected in data directory. Staging files..."
            git add data/
            git commit -m "Auto-update: New AI Blog Posts [$(date +'%Y-%m-%d')]"
            git push origin HEAD:main
          else
            echo "No new blog posts or data changes detected. Skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}